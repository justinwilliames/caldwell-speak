name: Build Pulsar

on:
  push:
    branches: [main]
    paths:
      - 'macos/Pulsar/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'macos/Pulsar/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    # Pulsar uses Liquid Glass APIs introduced in macOS 26 (Tahoe). The
    # runner is pinned to the explicit macos-26 label — no soft fallback.
    # Sentinel's R1 #1 (ratified): a workflow that "passes" without ever
    # compiling on the real target OS is a truth-telling failure, not a
    # convenience. If the runner drops below macOS 26 the precheck below
    # fails the job outright rather than skipping to green.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          xcode-select -p || true

      - name: Require macOS 26+
        id: precheck
        run: |
          MAJOR=$(sw_vers -productVersion | cut -d. -f1)
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::Runner is on macOS $(sw_vers -productVersion); Pulsar requires macOS 26+ (Liquid Glass APIs). Failing rather than skipping — a green run must mean it actually compiled on-target."
            exit 1
          fi

      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: macos/Pulsar/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('macos/Pulsar/Package.swift', 'macos/Pulsar/Sources/**/*.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Build (release)
        working-directory: macos/Pulsar
        run: swift build -c release

      - name: Verify binary
        run: |
          BINARY=$(find macos/Pulsar/.build -name Pulsar -type f -path "*/release/*" | head -1)
          if [ -z "$BINARY" ]; then
            echo "::error::Build did not produce a Pulsar binary"
            exit 1
          fi
          file "$BINARY"
          echo "Built: $BINARY"

      - name: Run tests
        run: ./scripts/run-tests.sh

      - name: Cast-consistency check
        run: ./scripts/cast-check.sh
